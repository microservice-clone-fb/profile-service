server:
  port: ${SERVER_PORT:5002}
  servlet:
    context-path: ${CONTEXT_PATH:/profile}

spring:
  application:
    name: ${APP_NAME:profile-service}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/clone-fb-profile-service?authSource=admin}

app:
  services:
    file: ${FILE_SERVICE_URL:http://localhost:5004}

logging:
  level:
    root: ${LOGGING_LEVEL:INFO}
    "[com.tam.profile]": ${LOGGING_LEVEL:INFO}
